name: Tests

# Runs PHP syntax checks and the unit suite (tests/run.php) across supported
# PHP versions (PHP 7.4+) on every push to main and every pull request.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      # xargs, not `find -exec … \;` — find exits 0 even when php -l fails,
      # so a syntax error never failed the job.
      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Unit tests
        run: php tests/run.php
